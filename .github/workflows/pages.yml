
    
  
name: Update dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: minutes 04, 09, 14, ... 59. GitHub may delay scheduled runs.
    - cron: '4-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aa-analytics-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Show trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          date -u '+UTC now: %Y-%m-%d %H:%M:%S'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Read Discord channel and build JSON
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_CHANNEL_ID" ]; then
            echo '::error::Missing DISCORD_BOT_TOKEN or DISCORD_CHANNEL_ID in GitHub Actions Secrets.'
            exit 1
          fi
          python -m scripts.sync_discord

      - name: Validate generated statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('site/data/stats.json')
          if not path.is_file():
              raise SystemExit('ERROR: site/data/stats.json was not generated')
          data = json.loads(path.read_text(encoding='utf-8'))
          matches = data.get('matches', [])
          print(f'Generated at: {data.get("generated_at")}')
          print(f'Parsed matches: {len(matches)}')
          if not matches:
              raise SystemExit('ERROR: No matches found. Check channel ID, bot permissions, Message Content Intent, and optional DISCORD_WEBHOOK_ID.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

