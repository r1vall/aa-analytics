
    
  
name: Update dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every 5 minutes, offset from the busy start of each hour (UTC).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read Discord channel and build JSON
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Missing DISCORD_BOT_TOKEN. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$DISCORD_CHANNEL_ID" ]; then
            echo "::error::Missing DISCORD_CHANNEL_ID. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m scripts.sync_discord
          python - <<'PY_CHECK'
          import json
          from pathlib import Path
          payload = json.loads(Path("site/data/stats.json").read_text(encoding="utf-8"))
          count = len(payload.get("matches", []))
          print(f"Verified Discord matches: {count}; generated_at: {payload.get('generated_at')}")
          if count == 0:
              raise SystemExit("No matches found. Check Discord bot permissions, Message Content Intent, channel ID and optional webhook filter.")
          PY_CHECK
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

